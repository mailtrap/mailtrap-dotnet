# Publishes the release drafted by draft-release.yml. Runs when the release PR lands on main
# (or manually, as a fallback / dry run): detects the pending draft from CHANGELOG.md, tests and
# packs Mailtrap and Mailtrap.Abstractions without any publishing rights, then pushes the
# packages to the org's GitHub Packages feed from the `release` environment, attaches them to the
# GitHub Release and un-drafts it, which creates the tag.
name: Release
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: detect the release, test and pack, but do not publish"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: Detect pending release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pending.outputs.version }}
      tag: ${{ steps.pending.outputs.tag }}
      go: ${{ steps.decide.outputs.go }}
    steps:
      - name: Refuse to release from a non-default branch
        env:
          REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Releases must run from $DEFAULT_BRANCH, got $REF"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve pending release
        id: pending
        uses: railsware/github-actions/resolve-pending-release@master

      # push: skip quietly when nothing is pending (an ordinary CHANGELOG edit).
      # dispatch: a real run needs an unreleased version; a dry run doesn't. detect can't see drafts
      # (read-only token), so the publish job confirms the draft after approval.
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          PENDING: ${{ steps.pending.outputs.pending }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$PENDING" = "true" ] || [ "$DRY_RUN" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::error::The top CHANGELOG.md version is already released; run Draft .NET Release first"
            exit 1
          else
            echo "Nothing to release"
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Test and pack
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # global.json picks the SDK; the test projects target net9.0, so its runtime is needed too.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: '9.0.x'

      # MinVer derives the version from the git tag, which only exists once the release is
      # published, so the CHANGELOG.md version is passed in.
      - name: Restore, build, test, pack
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          dotnet restore Mailtrap.sln --locked-mode
          dotnet build Mailtrap.sln --configuration Release --no-restore -p:MinVerVersionOverride="$VERSION"
          dotnet test Mailtrap.sln --configuration Release --no-build --settings tests/tests.runsettings
          dotnet pack Mailtrap.sln --configuration Release --no-build -p:MinVerVersionOverride="$VERSION" -o dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/
          if-no-files-found: error

  release:
    name: Publish
    needs: [detect, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # upload assets to and un-draft the release
      packages: write # push to the org's GitHub Packages NuGet feed
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist/

      # The draft disappears once a release is published, so this also stops a second publish.
      - name: Check GitHub release
        uses: railsware/github-actions/check-sdk-github-release@master
        with:
          tag: ${{ needs.detect.outputs.tag }}

      # The workflow token can push when both packages grant this repo write access
      # (package settings, "Manage Actions access").
      - name: Push to GitHub Packages
        env:
          NUGET_TOKEN: ${{ github.token }}
        run: |
          dotnet nuget push "dist/*.nupkg" \
            --source https://nuget.pkg.github.com/mailtrap/index.json \
            --api-key "$NUGET_TOKEN" \
            --skip-duplicate --no-symbols

      - name: Attach packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: gh release upload "$TAG" dist/*.nupkg dist/*.snupkg --repo "$GITHUB_REPOSITORY"

      - name: Publish GitHub release
        uses: railsware/github-actions/publish-github-release@master
        with:
          tag: ${{ needs.detect.outputs.tag }}
          target: ${{ github.sha }}
